    </div>

    const ORIGIN = "stamps.pages.dev";
    const SIZES = {
      square: { folder: "1254x1254", w: 500, h: 500 },
      wide:   { folder: "1774x887",  w: 600, h: 300 },
    };
    const weserv = (path, w, h) =>
      `https://wsrv.nl/?url=${ORIGIN}/${path}&w=${w}&h=${h}&fit=cover&output=jpg&q=82`;

    const gallery = document.getElementById("gallery");
    const frag = document.createDocumentFragment();

    for (const [code, name, desc] of COUNTRIES) {
      const fig = document.createElement("figure");
      fig.className = "stamp";

      const inner = document.createElement("div");
      inner.className = "stamp-inner";

      const top = document.createElement("div");
      top.className = "stamp-top";
      top.innerHTML = `<span class="stamp-country">${name}</span><span class="stamp-code">${code.toUpperCase()}</span>`;

      const img = document.createElement("img");
      img.className = "stamp-img";
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = `Travel illustration of ${name}`;
      img.dataset.code = code;

      const caption = document.createElement("figcaption");
      caption.className = "stamp-caption";
      caption.textContent = desc;

      const postmark = document.createElement("div");
      postmark.className = "postmark";
      postmark.setAttribute("aria-hidden", "true");
      postmark.innerHTML = `<span>${code.toUpperCase()}</span><em>Air Mail</em>`;

      inner.append(top, img, caption, postmark);
      fig.append(inner);
      frag.append(fig);
    }

    gallery.append(frag);

    function applyAspect(aspect) {
      const cfg = SIZES[aspect];
      gallery.dataset.aspect = aspect;
      for (const img of gallery.querySelectorAll(".stamp-img")) {
        img.src = weserv(`images/${cfg.folder}/${img.dataset.code}.png`, cfg.w, cfg.h);
        img.width = cfg.w;
        img.height = cfg.h;
      }
      for (const btn of document.querySelectorAll(".aspect-toggle button")) {
        btn.setAttribute("aria-pressed", String(btn.dataset.aspect === aspect));
      }
    }

    document.querySelector(".aspect-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-aspect]");
      if (btn) applyAspect(btn.dataset.aspect);
    });

    applyAspect("square");
